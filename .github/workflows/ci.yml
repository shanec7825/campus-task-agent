name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-reliability:
    name: Backend reliability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      MAAS_MOCK: '1'
      MAAS_API_KEY: ''
      RUN_SCHEDULER: '0'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest tests/backend/test_reliability.py -q
      - name: Run auth, organization and activity workflow behavior suites
        run: python -m pytest tests/backend/test_auth_org_permissions.py tests/backend/test_activity_hierarchy.py tests/backend/test_activity_workflow.py -q
      - name: Run AI read-only console suite
        run: python -m pytest tests/backend/test_ai_console.py -q
      - name: Run AIW-02 activity scope suite
        run: python -m pytest tests/backend/test_aiw02_activity_scope.py -q

  backend-integration:
    name: Backend API and SSE integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAAS_MOCK: '1'
      MAAS_API_KEY: ''
      RUN_SCHEDULER: '0'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Run existing isolated API and SSE suite
        run: bash tests/backend/run_all.sh

  frontend:
    name: Frontend build, voice and public source security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: frontend
      - run: bash tests/frontend/run_all.sh

      - run: bash tests/security/test_security_redline.sh
